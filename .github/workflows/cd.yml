name: CD

on:
  push:
    tags: ['v*']

jobs:
  ci-check:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Verify CI passed for tagged commit
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Checking CI check runs for commit $SHA ..."
          # GitHub Actions reports via Check Runs (job names), not commit status context.
          # CI workflow jobs: lint, test, build, release-prep. Require completed; accept success or skipped.
          # (release-prep can show as skipped when multiple runs exist for the same commit, e.g. PR vs push.)
          CI_JOBS="lint test build release-prep"
          for i in $(seq 1 20); do
            BODY=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" -q '.check_runs')
            echo "Attempt $i:"
            FAIL=0
            DONE=0
            for JOB in $CI_JOBS; do
              RUN=$(echo "$BODY" | jq -r --arg j "$JOB" '.[] | select(.name == $j) | "\(.status) \(.conclusion // "null")"' | head -1)
              if [ -z "$RUN" ]; then
                echo "  $JOB: not found (CI may not have started)"
                DONE=1
                break
              fi
              STAT=$(echo "$RUN" | awk '{print $1}')
              CONCL=$(echo "$RUN" | awk '{print $2}')
              echo "  $JOB: status=$STAT conclusion=$CONCL"
              if [ "$STAT" != "completed" ]; then
                DONE=1
              elif [ "$CONCL" = "failure" ] || [ "$CONCL" = "cancelled" ] || [ "$CONCL" = "timed_out" ] || [ "$CONCL" = "action_required" ]; then
                echo "::error::CI job $JOB concluded with $CONCL. Aborting release."
                FAIL=1
                break
              fi
            done
            if [ "$FAIL" -eq 1 ]; then
              exit 1
            fi
            if [ "$DONE" -eq 0 ]; then
              echo "All CI check runs passed."
              exit 0
            fi
            echo "CI not done yet, waiting 30s ..."
            sleep 30
          done
          echo "::error::CI did not complete within 10 minutes. Aborting release."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python:
    runs-on: ubuntu-latest
    needs: [ci-check]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: uv build

      - name: Upload Python dist
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # Linux/Ubuntu exe build temporarily disabled (packaging issues).
  build-exe:
    needs: [ci-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            exe_name: neurolight-${{ github.ref_name }}-windows-amd64.zip
            artifact_name: exe-windows
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies and PyInstaller
        run: uv sync --extra build

      - name: Build executable
        run: uv run pyinstaller neurolight.spec --noconfirm --clean
        env:
          # Prevent PyInstaller from embedding a random runpath
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller

      - name: Prepare release asset (Windows)
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release-asset
          cd dist
          7z a -tzip "../release-asset/${{ matrix.exe_name }}" Neurolight/

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-asset/

  macos-release-assets:
    name: Build macOS DMG and attach to release
    runs-on: macos-latest
    needs: [ci-check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build macOS app and DMG
        run: |
          chmod +x build-macos-app.sh build-macos-dmg.sh
          ./build-macos-app.sh
          ./build-macos-dmg.sh

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERT: ${{ secrets.DEVELOPER_ID_CERT }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          echo "$DEVELOPER_ID_CERT" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | sed 's/"//g')
          rm /tmp/certificate.p12

      - name: Sign macOS app
        run: |
          SIGN_IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          codesign --deep --force --options runtime \
            --sign "$SIGN_IDENTITY" \
            dist/Neurolight.app

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Re-package signed app into DMG
        run: ./build-macos-dmg.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit dist/Neurolight.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple notarization
        run: xcrun stapler staple dist/Neurolight.dmg

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: |
            dist/Neurolight.dmg

  release:
    runs-on: ubuntu-latest
    needs: [build-python, build-exe, macos-release-assets]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-package

      - name: Validate artifacts exist
        run: |
          missing=0
          for dir in python-dist exe-windows; do
            path="release-package/$dir"
            if [ ! -d "$path" ] || [ -z "$(ls -A "$path")" ]; then
              echo "::error::Missing or empty artifact directory: $path"
              missing=1
            else
              echo "OK: $path contains $(ls "$path" | wc -l) file(s)"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::One or more required artifacts are missing. Aborting release."
            exit 1
          fi

      - name: Flatten artifacts into release folder
        run: |
          mkdir -p release-package/upload
          cp release-package/python-dist/* release-package/upload/
          cp release-package/exe-windows/* release-package/upload/

      # GitHub release assets must be <= 2 GB per file (2147483648 bytes)
      - name: Drop assets over 2 GB and list sizes
        run: |
          MAX_BYTES=2147483648
          echo "Asset sizes (before dropping):"
          for f in release-package/upload/*; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            printf "  %s: %s bytes\n" "$(basename "$f")" "$sz"
            if [ "$sz" -gt "$MAX_BYTES" ]; then
              echo "  -> REMOVING (exceeds ${MAX_BYTES} byte limit)"
              rm -f "$f"
            fi
          done
          echo "Remaining assets:"
          ls -la release-package/upload/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-package/upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}